<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/loja.css">

    <title>Marcos Coutinho - A loja virtual</title>

</head>


<body>

    <nav>

        <label for="search">
            <i class="bi bi-search"></i>
            <input type="text" id="search" placeholder="Buscar produto ou palavra-chave">
        </label>

        <div class="bag-area">
            <i class="bi bi-handbag-fill" id="abrirCarrinho"></i>
            <span id="contadorCarrinho">0</span>
        </div>
    </nav>

    <!-- ----------- CARRINHO ----------- -->

    <div id="carrinho">
        <button id="fecharCarrinho">
            <i class="bi bi-x-lg"></i>
        </button>

        <h2>Seu Carrinho</h2>
        <div id="lista-carrinho"></div>
        <button class="btn-finalizar" id="btnFinalizar">Finalizar Pedido</button>
    </div>

    <main class="page" id="page">


        <!-- ----------- Produtos ----------- -->

        <div class="produtos">

            <div class="card">
                <img src="img/Fone-De-Ouvido-Tws-Bluetooth_1736543662_gg.webp" alt="">
                <h3>Fone de ouvido TWS</h3>
                <button class="btn-comprar" data-produto="Fone de ouvido TWS">Adicionar ao Carrinho</button>
            </div>

            <div class="card">
                <img src="img/GARRAFINHA-C-SILICONE-BRANCO.webp" alt="">
                <h3>Garrafinha com base</h3>
                <button class="btn-comprar" data-produto="Garrafinha com base">Adicionar ao Carrinho</button>
            </div>

            <div class="card">
                <img src="img/carregador_power_bank_5_000mah_11082_1_2b9fd69b3ca4b56d80bcdc71271a290a.webp" alt="">
                <h3>Power Bank 5000mAh</h3>
                <button class="btn-comprar" data-produto="Power Bank 5000mAh">Adicionar ao Carrinho</button>
            </div>

        </div>
    </main>

    <script src="js/compras.js"></script>

</body>

</html>
