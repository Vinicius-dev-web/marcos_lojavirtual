<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/painel.css">

    <title>Painel de controle</title>

</head>

<body>

    <div class="painel">

        <div class="painel-info">

            <h1>MarcosTech</h1>

            <ul>
                <li data-target="produtos">
                    <i class="bi bi-speedometer2"></i>
                    <span>PAINEL</span>
                </li>
                <li data-target="create">
                    <i class="bi bi-images"></i>
                    <span>PRODUTO</span>
                </li>
                <li data-target="users">
                    <i class="bi bi-people"></i>
                    <span>USUÁRIOS</span>
                </li>
                <li data-target="cog">
                    <i class="bi bi-building"></i>
                    <span>EMPRESA</span>
                </li>
            </ul>


        </div>

        <!-- <button>sair</button> -->

        <div class="logout" id="logout" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>
            <span>SAIR</span>
        </div>

    </div>

    <nav class="main-content">

        <div class="adm-info-up">

            <h2>Marcos</h2>
            <span>Administrador</span>

        </div>

        <div class="info-now-up">

            <span id="dataAtual"></span>
            <i class="bi bi-cloud"></i>

        </div>

    </nav>

    <main class="page">

        <section class="produtos" id="produtos">
            <div class="info-pdt-cards">
                <div class="info-card" id="estoque">

                    <div class="title-card">
                        <h2>Estoque</h2>
                        <i class="bi bi-archive"></i>
                    </div>

                    <span class="qntd-prod" id="qntd-prod"><b>0</b></span>

                </div>
            </div>

            <div class="tabela-container">

                <table class="tabela-estilo">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <!-- <th>Categoria</th> -->
                            <th>Preço</th>
                            <!-- <th>Status</th> -->
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="nome-do-produto-table">a</td>
                            <!-- <td>a</td> -->
                            <td id="preco-do-produto-table">R$ 0,00</td>
                            <!-- <td><span class="status ativo">Ativo</span></td> -->
                        </tr>
                        <tr>
                            <td id="nome-do-produto-table">b</td>
                            <!-- <td>b</td> -->
                            <td id="preco-do-produto-table">R$ 0,00</td>
                            <!-- <td><span class="status inativo">Inativo</span></td> -->
                        </tr>
                        <tr>
                            <td id="nome-do-produto-table">c</td>
                            <!-- <td>c</td> -->
                            <td id="preco-do-produto-table">R$ 0,90</td>
                            <!-- <td><span class="status ativo">Ativo</span></td> -->
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

        <section class="create" id="create">

            <div class="form-div" id="file-create">

                <form action="">

                    <label for="file">

                        <i class="bi bi-image"></i>
                        <span>Adicione uma imagem</span>

                        <input type="file" name="" id="file" hidden>

                    </label>

                    <input type="text" name="" id="nome-do-produto" placeholder="Nome do produto">

                    <input type="text" name="" id="preco-do-produto" placeholder="Valor do produto">

                    <button class="submit" id="submit">Criar</button>

                </form>
            </div>
        </section>

        <section class="users" id="users">

            <div class="form-div">

                <form action="">

                    <label for="file" id="file-user">

                        <i class="bi bi-image"></i>
                        <span>Adicione uma imagem</span>

                        <input type="file" name="" id="file" hidden>

                    </label>

                    <input type="text" name="" id="name-user" placeholder="Nome do funcionário" required>

                    <input type="tel" name="" id="tel-user" placeholder="Número de telefone (opcional)">

                    <input type="text" name="" id="date-user" placeholder="Data de nascimento (opcional)">

                    <button class="submit" id="submit">Criar</button>

                </form>
            </div>
        </section>

        <section class="cog" id="cog"></section>

    </main>


</body>

<script>

    function logout() {
        location.href = "login.html"
    }
</script>

<script src="js/painel.js"></script>
<script src="js/datas.js"></script>

</html>
