<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/painel.css">

    <title>Painel de controle</title>

</head>

<body>

    <div class="painel">

        <div class="painel-info">

            <h1>MarcosTech</h1>

            <ul>
                <li data-target="produtos">
                    <i class="bi bi-speedometer2"></i>
                    <span>PRODUTOS</span>
                </li>
                <li data-target="banners">
                    <i class="bi bi-images"></i>
                    <span>BANNERS</span>
                </li>
                <li data-target="users">
                    <i class="bi bi-people"></i>
                    <span>USUÁRIOS</span>
                </li>
                <li data-target="cog">
                    <i class="bi bi-building"></i>
                    <span>EMPRESA</span>
                </li>
            </ul>


        </div>

        <!-- <button>sair</button> -->

        <div class="logout" id="logout" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>
            <span>SAIR</span>
        </div>

    </div>

    <nav class="main-content">

        <div class="adm-info-up">

            <h1>Marcos</h1>
            <span>Administrador</span>

        </div>

        <div class="info-now-up">

            <span id="dataAtual"></span>
            <i class="bi bi-cloud"></i>

        </div>

    </nav>

    <main class="page">

        <section class="produtos" id="produtos">
            <div class="info-pdt-cards">
                <div class="info-card" id="estoque">

                    <div class="title-card">
                        <h2>Estoque</h2>
                        <i class="bi bi-archive"></i>
                    </div>

                    <span class="qntd-prod" id="qntd-prod"><b>0</b></span>

                </div>
            </div>
        </section>

        <section class="banners" id="banners"></section>
        <section class="users" id="users"></section>
        <section class="cog" id="cog"></section>

    </main>


</body>

<script>

    function logout() {
        location.href = "login.html"
    }
</script>

<script src="js/painel.js"></script>
<script src="js/datas.js"></script>

</html>
