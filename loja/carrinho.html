<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@300;400;500;700&family=Zalando+Sans+SemiExpanded:wght@200;400;600;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="tema.php?slug=<?php echo urlencode($slug); ?>">
    <link rel="stylesheet" href="carrinho.css">

    <link rel="icon" href="">

    <title>
        BShop - Carrinho
    </title>
</head>

<body>

    <nav>
        <div class="logo">
            BShop
        </div>

        <div class="icons">
            <i class="bi bi-shield-check"></i>
            <span>Carrinho</span>
        </div>

    </nav>

    <div class="carrinho">

        <div class="card-prod">
            <div class="lista-carrinho" id="lista-carrinho">

                <!-- Preview -->
                <div class="card">

                    <img src="../img/jabutike.jpg" alt="${p.nome}">

                    <div class="info-prod">

                        <h3>Roupa</h3>

                        <p class="tamanho">Tamanho: p</p>

                        <p>R$ 159,90</p>
                    </div>

                    <div class="add-item">

                        <button id="lowItem" onclick="lowItem()">-</button>
                        <p id="count-item">1</p>
                        <button onclick="moreItem()">+</button>

                    </div>

                    <button class="btn-excluir" data-index="${index}" title="Remover">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>

            </div>
        </div>

        <div class="card-price">

            <div class="price">

                <h2>Total a pagar</h2>

                <div class="price-frete">
                    <span>Frete: </span>
                    <span id="freteTotal">R$ 0,00</span>
                </div>

                <div class="price-off">
                    <span>Desconto</span>
                    <span>R$ 0,00</span>
                </div>

                <div class="price-ofc">
                    <strong><span>Valor total</span></strong>

                    <strong><span id="precoTotal">R$ 0,00</span></strong>
                </div>

                <form class="form">

                    <div class="delivery">

                        <input type="text" id="nomeUser" placeholder="Nome social*" maxlength="20" required>

                        <input type="text" id="cepUser" placeholder="CEP" maxlength="9">

                        <input type="text" id="ruaUser" placeholder="Rua*" maxlength="50" required>

                        <input type="text" id="bairroUser" placeholder="Bairro*" maxlength="50" required>

                        <input type="text" id="numeroUser" placeholder="Número da casa/apto.*" maxlength="5" required>

                        <input type="text" id="telUser" placeholder="Telefone" maxlength="20">

                    </div>

                    <label for="sale">
                        <i class="bi bi-ticket-perforated-fill"></i>
                        <input type="text" id="sale" placeholder="Cupom promocional">
                    </label>
                </form>

            </div>

            <button class="btn-finalizar" id="btnFinalizar">Finalizar Pedido</button>

        </div>

    </div>

</body>

<script>

    let countItem = document.getElementById("count-item")
    let btnMin = document.getElementById("lowItem")

    let count = 0
    let min = 0

    function updateButton() {
        btnMin.disabled = (count === min);
    }

    function moreItem() {
        count++;
        countItem.innerHTML = count;
        updateButton()
    }

    function lowItem() {

        if (count > min) {

            count--;
        }
        countItem.innerHTML = count;
        updateButton();
    }
</script>

</html>
